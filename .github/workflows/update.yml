name: Update ToC Hub

on:
  schedule:
    - cron: '*/15 * * * 0,1,4'   # every 15 min on Sun, Mon, Thu (UTC): game days
    - cron: '0 */3 * * *'        # every 3 hours otherwise
  workflow_dispatch:             # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write                # needed to save raw snapshots to the raw-snapshots branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # let an archive finish rather than cutting it off

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The scorers must agree with hand-worked answers before anything is published.
      - name: Run scoring tests
        run: node --test tests/scoring.test.mjs

      - name: Pull Sleeper data and build data.json
        run: node scripts/build-data.mjs

      # Keep a timestamped copy of the raw Sleeper data so any score can be re-derived later.
      # Failures here never block the site.
      - name: Open the raw-snapshots branch
        continue-on-error: true
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO" raw-snapshots >/dev/null 2>&1; then
            git clone --depth 1 --branch raw-snapshots "$REPO" snapshots-branch
          else
            mkdir snapshots-branch && cd snapshots-branch && git init -q -b raw-snapshots && git remote add origin "$REPO"
          fi
      - name: Archive raw snapshot
        continue-on-error: true
        run: |
          node scripts/archive.mjs raw/snapshot.json snapshots-branch
          cd snapshots-branch
          git config user.name "toc-hub-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Raw Sleeper snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -q origin HEAD:raw-snapshots
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # Ask Vercel to rebuild so its copy of the site is fresh too. Skipped unless the VERCEL_DEPLOY_HOOK secret exists.
      # On scheduled runs it fires at most about once an hour (Vercel's free plan allows 100 deployments a day).
      - name: Refresh Vercel
        if: ${{ always() && env.VERCEL_DEPLOY_HOOK != '' }}
        continue-on-error: true
        run: |
          M=$(date -u +%M)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$((10#$M))" -lt 20 ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "Vercel rebuild requested"
          else
            echo "Skipped Vercel rebuild this run"
          fi
