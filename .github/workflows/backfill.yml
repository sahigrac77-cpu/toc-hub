name: Backfill ToC weeks (report only)

# Replays the ToC from Week 1 with real Sleeper data and saves a report to this branch.
# It never publishes the site and never touches the live deployment.
on:
  push:
    branches: ['backfill/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scoring tests
        run: node --test tests/scoring.test.mjs

      - name: Pull Sleeper data and replay the ToC
        run: node scripts/build-data.mjs

      - name: Build the backfill report
        run: |
          mkdir -p reports
          node scripts/backfill-report.mjs public/data.json tests/week5-state.json > reports/backfill.json

      # Same build the live site runs (the league's accepted Week 5 start), so eliminations since Week 5 are the real ones.
      - name: Replay with the league's accepted Week 5 state
        run: |
          git fetch --depth=1 origin main
          cp config.json /tmp/config.backfill.json
          git show origin/main:config.json > config.json
          mkdir -p /tmp/prod
          OUT_FILE=/tmp/prod/data.json RAW_OUT=/tmp/prod/raw.json node scripts/build-data.mjs
          cp /tmp/config.backfill.json config.json
          node scripts/prod-report.mjs /tmp/prod/data.json > reports/production.json

      - name: Save the reports to this branch
        run: |
          git config user.name "toc-hub-bot" && git config user.email "actions@users.noreply.github.com"
          git add reports/backfill.json reports/production.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -q -m "Backfill report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -q origin HEAD:${{ github.ref_name }}
          fi
